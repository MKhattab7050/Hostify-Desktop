name: Validate Hostify Desktop release and feature branches

on:
  push:
    branches: [release/v2-rc1, 'feature/**']
  pull_request:
    branches: [release/v2-rc1, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR validations, but never interrupt an in-progress
# release-branch Windows installer build. GitHub queues the newest release
# commit when another release validation is already running.
concurrency:
  group: hostify-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release/v2-rc1' }}

jobs:
  windows:
    name: Windows Rust, TypeScript and browser regression
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Cargo fingerprints source changes, so reusing dependency/debug output
      # across checks with the same lockfile avoids full Windows recompiles.
      # Release binaries remain rebuilt from the tested release commit.
      - name: Cache Rust registry and debug build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: hostify-windows-rust-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            hostify-windows-rust-v1-${{ runner.os }}-
      - name: Install pinned frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm lint
      - name: Build frontend
        run: pnpm build
      - name: Verify Windows live-test script reports absent components honestly
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-verify-hosting-windows.ps1
      - name: Test Rust workspace (including security regressions)
        run: cargo test --workspace --locked
      - name: Test real UI flows with Edge and the isolated preview backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proc = Start-Process -FilePath 'cmd.exe' -ArgumentList '/d /c pnpm preview --port 4173 --host 127.0.0.1' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $client = [System.Net.Sockets.TcpClient]::new()
                $client.Connect('127.0.0.1', 4173)
                $client.Dispose()
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw 'Preview server did not become ready' }
            pnpm test:ui
            if ($LASTEXITCODE -ne 0) { throw 'UI test suite failed' }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              taskkill /T /F /PID $proc.Id | Out-Null
            }
          }

      # Package only an already-tested release-branch commit, never a PR.
      # The result is an unsigned candidate, not an automatic public release.
      - name: Build unsigned NSIS installer for release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/v2-rc1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri build
          if ($LASTEXITCODE -ne 0) { throw 'Tauri installer build failed' }
          $bundles = @(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction Stop)
          if ($bundles.Count -ne 1) { throw "Expected one NSIS installer, found $($bundles.Count)" }
          $sha256 = (Get-FileHash -LiteralPath $bundles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Join-Path 'target/release/bundle/nsis' 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($manifest, "$sha256  $($bundles[0].Name)`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "Built unsigned candidate: $($bundles[0].Name) ($sha256)"
      - name: Upload unsigned Windows installer artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/v2-rc1'
        uses: actions/upload-artifact@v4
        with:
          name: Hostify-V2-RC-Windows-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

# Live PHP, Node, Caddy, MySQL and Cloudflare tests require explicit sandbox
# binaries/credentials and are NOT treated as passed by this workflow.
